<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#07090D"/><rect x="48" y="54" width="4" height="50" fill="#FF7A3D"/>
  <g font-family="Geist, sans-serif"><text x="66" y="75" font-size="18" font-weight="600" fill="#FF7A3D">24 / 29</text><text x="230" y="75" font-size="18" fill="#A7B0C0">MARKET / WHO JURIS SERVES</text><text x="1450" y="75" font-size="16" fill="#A7B0C0">JURIS / OPPORTUNITY</text></g>
  <text x="88" y="230" font-family="Archivo, Arial Black, sans-serif" font-size="78" font-weight="900" fill="#FFFFFF">ONE INTELLIGENCE</text><text x="88" y="316" font-family="Archivo, Arial Black, sans-serif" font-size="80" font-weight="900" fill="#4F8BFF">LAYER. MANY USERS.</text>
  <text x="94" y="392" font-family="Geist, sans-serif" font-size="25" fill="#A7B0C0">The same underlying system adapts to different legal-reading jobs.</text>
  <g font-family="Geist, sans-serif">
    <g><line x1="90" y1="480" x2="610" y2="480" stroke="#FF7A3D" stroke-width="3"/><text x="90" y="540" font-family="Archivo" font-size="34" font-weight="900" fill="#FF7A3D">01</text><text x="176" y="536" font-size="24" font-weight="700" fill="#FFFFFF">LAW FIRMS</text><text x="176" y="580" font-size="19" fill="#A7B0C0">Accelerate repetitive review</text><text x="176" y="606" font-size="19" fill="#A7B0C0">and source finding.</text></g>
    <g><line x1="700" y1="430" x2="1220" y2="430" stroke="#4F8BFF" stroke-width="3"/><text x="700" y="490" font-family="Archivo" font-size="34" font-weight="900" fill="#4F8BFF">02</text><text x="786" y="486" font-size="24" font-weight="700" fill="#FFFFFF">STARTUPS + SMEs</text><text x="786" y="530" font-size="19" fill="#A7B0C0">Understand contracts before</text><text x="786" y="556" font-size="19" fill="#A7B0C0">decisions and signatures.</text></g>
    <g><line x1="1310" y1="480" x2="1830" y2="480" stroke="#C8FF3D" stroke-width="3"/><text x="1310" y="540" font-family="Archivo" font-size="34" font-weight="900" fill="#C8FF3D">03</text><text x="1396" y="536" font-size="24" font-weight="700" fill="#FFFFFF">ENTERPRISES</text><text x="1396" y="580" font-size="19" fill="#A7B0C0">Structure obligations, risks</text><text x="1396" y="606" font-size="19" fill="#A7B0C0">and version changes.</text></g>
    <g><line x1="90" y1="760" x2="610" y2="760" stroke="#4F8BFF" stroke-width="3"/><text x="90" y="820" font-family="Archivo" font-size="34" font-weight="900" fill="#4F8BFF">04</text><text x="176" y="816" font-size="24" font-weight="700" fill="#FFFFFF">UNIVERSITIES</text><text x="176" y="860" font-size="19" fill="#A7B0C0">Teach legal interpretation</text><text x="176" y="886" font-size="19" fill="#A7B0C0">with grounded source context.</text></g>
    <g><line x1="700" y1="810" x2="1220" y2="810" stroke="#FF7A3D" stroke-width="3"/><text x="700" y="870" font-family="Archivo" font-size="34" font-weight="900" fill="#FF7A3D">05</text><text x="786" y="866" font-size="24" font-weight="700" fill="#FFFFFF">CITIZENS + STUDENTS</text><text x="786" y="910" font-size="19" fill="#A7B0C0">Translate difficult legal language</text><text x="786" y="936" font-size="19" fill="#A7B0C0">into clear meaning.</text></g>
    <g><line x1="1310" y1="760" x2="1830" y2="760" stroke="#4F8BFF" stroke-width="3"/><text x="1310" y="820" font-family="Archivo" font-size="34" font-weight="900" fill="#4F8BFF">06</text><text x="1396" y="816" font-size="24" font-weight="700" fill="#FFFFFF">GOVERNMENT</text><text x="1396" y="860" font-size="19" fill="#A7B0C0">Support document-heavy review</text><text x="1396" y="886" font-size="19" fill="#A7B0C0">and public access.</text></g>
  </g>
  <text x="960" y="1014" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#A7B0C0">ADDRESSABLE WORKFLOWS — NOT CLAIMED CUSTOMERS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#07090D"/><rect x="48" y="54" width="4" height="50" fill="#FF7A3D"/>
  <g font-family="Geist, sans-serif"><text x="66" y="75" font-size="18" font-weight="600" fill="#FF7A3D">25 / 29</text><text x="230" y="75" font-size="18" fill="#A7B0C0">THESIS / WHY INVESTORS SHOULD CARE</text><text x="1450" y="75" font-size="16" fill="#A7B0C0">JURIS / WHY THIS, WHY NOW</text></g>
  <text x="88" y="230" font-family="Archivo, Arial Black, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF">LEGAL WORK IS</text><text x="88" y="316" font-family="Archivo, Arial Black, sans-serif" font-size="80" font-weight="900" fill="#FF7A3D">BECOMING SOFTWARE.</text><text x="94" y="392" font-family="Geist, sans-serif" font-size="25" fill="#A7B0C0">Four forces are converging around a scalable legal-intelligence layer.</text>
  <g font-family="Geist, sans-serif">
    <g><rect x="90" y="470" width="1500" height="94" fill="#111827" stroke="#FF7A3D"/><text x="116" y="531" font-family="Archivo" font-size="34" font-weight="900" fill="#FF7A3D">01</text><text x="196" y="524" font-size="18" font-weight="700" letter-spacing="1" fill="#FFFFFF">WHY NOW</text><text x="450" y="525" font-size="20" fill="#A7B0C0">Contract volume and complexity keep rising; review speed has not.</text></g>
    <g><rect x="90" y="590" width="1380" height="94" fill="#111827" stroke="#4F8BFF"/><text x="116" y="651" font-family="Archivo" font-size="34" font-weight="900" fill="#4F8BFF">02</text><text x="196" y="644" font-size="18" font-weight="700" letter-spacing="1" fill="#FFFFFF">WHY AI</text><text x="450" y="645" font-size="20" fill="#A7B0C0">Professional services are adopting AI where evidence and trust are designed in.</text></g>
    <g><rect x="90" y="710" width="1260" height="94" fill="#111827" stroke="#C8FF3D"/><text x="116" y="771" font-family="Archivo" font-size="34" font-weight="900" fill="#C8FF3D">03</text><text x="196" y="764" font-size="18" font-weight="700" letter-spacing="1" fill="#FFFFFF">WHY LEGAL</text><text x="450" y="765" font-size="20" fill="#A7B0C0">Legal reading is repetitive, high-value and still fragmented across tools.</text></g>
    <g><rect x="90" y="830" width="1140" height="94" fill="#202A3C" stroke="#FF7A3D"/><text x="116" y="891" font-family="Archivo" font-size="34" font-weight="900" fill="#FF7A3D">04</text><text x="196" y="884" font-size="18" font-weight="700" letter-spacing="1" fill="#FFFFFF">WHY JURIS</text><text x="450" y="885" font-size="20" fill="#A7B0C0">OCR, retrieval, analysis, comparison and Compass already live in one surface.</text></g>
  </g>
  <text x="1800" y="884" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#4F8BFF">SCALABLE SAAS SURFACE</text><text x="1800" y="930" text-anchor="end" font-family="Geist, sans-serif" font-size="21" fill="#FFFFFF">From one uploaded contract</text><text x="1800" y="960" text-anchor="end" font-family="Geist, sans-serif" font-size="21" fill="#FFFFFF">to an organisational intelligence layer.</text>
</svg>

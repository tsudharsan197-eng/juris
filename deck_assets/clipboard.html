<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Juris deck asset clipboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #07090d;
        color: #fff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        color: #a7b0c0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 28px;
      }

      button {
        min-height: 56px;
        border: 1px solid #33405a;
        border-radius: 0;
        background: #111827;
        color: #fff;
        font: 600 16px/1 system-ui, sans-serif;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        border-color: #4f8bff;
        outline: 2px solid #4f8bff;
        outline-offset: 2px;
      }

      #status {
        min-height: 24px;
        margin-top: 18px;
        color: #c8ff3d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Juris deck asset clipboard</h1>
      <p>Each button copies the SVG markup so Figma can paste it as editable vectors.</p>
      <div class="grid">
        <button data-file="slide23.svg">Copy slide 23</button>
        <button data-file="slide24.svg">Copy slide 24</button>
        <button data-file="slide25.svg">Copy slide 25</button>
        <button data-file="slide26.svg">Copy slide 26</button>
        <button data-file="slide27.svg">Copy slide 27</button>
        <button data-file="slide28.svg">Copy slide 28</button>
        <button data-file="slide29.svg">Copy slide 29</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const status = document.querySelector('#status');

      async function copySvg(file) {
        const svg = await fetch(file).then((response) => {
          if (!response.ok) throw new Error(`Could not load ${file}`);
          return response.text();
        });

        try {
          await navigator.clipboard.writeText(svg);
        } catch {
          const textarea = document.createElement('textarea');
          textarea.value = svg;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        }

        status.textContent = `${file} copied as SVG markup.`;
      }

      document.querySelectorAll('button[data-file]').forEach((button) => {
        button.addEventListener('click', () => copySvg(button.dataset.file));
      });
    </script>
  </body>
</html>

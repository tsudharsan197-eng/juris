name: Security regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCR_DEBUG: 'false'
      R2_MAINTENANCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libglib2.0-0
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend regression tests (no production credentials)
        run: python -m pytest backend/tests -q
      - name: Compile backend and audit command
        run: python -m py_compile backend/app/main.py backend/app/services/security_audit_service.py backend/scripts/security_check.py
      - name: Install isolated SQL test engine
        env:
          P0_SQL_TEST_DEPS: ${{ runner.temp }}/juris-sql-tests
        run: npm install --prefix "$P0_SQL_TEST_DEPS" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Security SQL regression tests (disposable database)
        env:
          P0_SQL_TEST_DEPS: ${{ runner.temp }}/juris-sql-tests
        run: |
          node backend/tests/r2_sql_smoke.mjs
          node backend/tests/document_security_sql_smoke.mjs
          node backend/tests/security_audit_sql_smoke.mjs
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Verify production image includes operational commands
        run: |
          docker build --tag juris-security-check backend
          docker run --rm --network none juris-security-check python scripts/security_check.py --help
      - name: Verify project memory and Git hygiene
        run: ./scripts/verify-project-memory.sh
